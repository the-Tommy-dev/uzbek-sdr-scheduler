name: Tradehouse scheduled checks
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: read
concurrency:
  group: tradehouse-worker
  cancel-in-progress: false
jobs:
  tick:
    if: vars.SDR_HOSTED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - name: Five-minute collection and workflow ticks
        env:
          WORKER_SECRET: ${{ secrets.SDR_WORKER_SECRET }}
        run: node tick.mjs
